<svg xmlns="http://www.w3.org/2000/svg" width="40" height="40" viewBox="0 0 40 40" data-slice="8" data-filled="true">
  <!-- Straight edges use whole pixels. Centre starts at radius=8; 2px border.
       RGB fills the complete canvas before the final silhouette/hole mask.
       Labels, plus glyph and active cue belong to the widget, never this patch. -->
  <defs><mask id="silhouette" maskUnits="userSpaceOnUse" x="0" y="0" width="40" height="40">
    <rect width="40" height="40" fill="black"/>
    <rect width="40" height="40" rx="8" fill="white"/>
    
  </mask></defs>
  <g mask="url(#silhouette)">
    <rect width="40" height="40" fill="#5e5e5e"/>
    <rect x="2" y="2" width="36" height="36" rx="6" fill="#121212"/>
  </g>
</svg>
